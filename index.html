<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk Elitech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#364fab;
    --brand-fg:#ffffff;
    --brand-soft:#eef0f9;
    --bg:#ffffff;
    --surface:#f5f6f9;
    --text:#14151a;
    --text-2:#6b7280;
    --text-3:#9aa0ac;
    --border:#e6e8ee;
    --radius:14px;
    --morph:0.55s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--brand-soft);}

  .container{max-width:1080px;margin:0 auto;padding:0 16px 48px;}

  /* ---------- Top bar ---------- */
  #topbar{
    position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  #topbar-inner{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;height:44px;}
  .icon-btn{width:38px;height:38px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--text);transition:background .2s;}
  .icon-btn:hover{background:var(--border);}
  #back-btn{display:none;}
  #page-title{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .3s ease;}
  #compare-icon{position:relative;}
  #compare-badge{
    display:none;position:absolute;top:-2px;right:-2px;background:var(--brand);color:var(--brand-fg);
    font-size:10px;font-weight:600;border-radius:50%;width:16px;height:16px;align-items:center;justify-content:center;
  }
  #search-wrap{
    display:flex;align-items:center;background:var(--surface);border-radius:999px;height:38px;width:38px;
    overflow:hidden;transition:width var(--morph);flex-shrink:0;
  }
  #search-input{border:none;background:transparent;flex:1;min-width:0;height:100%;font-size:14px;outline:none;width:0;padding:0;color:var(--text);}
  #search-toggle{width:38px;height:38px;flex-shrink:0;}

  /* ---------- Views ---------- */
  .view{display:none;}
  .view.active{display:block;}
  .view-transition{animation:viewIn var(--morph) both;}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Category banner + chips ---------- */
  #category-banner{
    margin-top:16px;border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    background:var(--brand-soft);
  }
  #category-banner p.eyebrow{font-size:11px;margin:0 0 2px;color:var(--brand);}
  #category-banner p.title{font-size:15px;font-weight:600;margin:0;}
  #category-banner .icons{display:flex;gap:12px;color:var(--brand);}

  #chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none;}
  #chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;font-size:13px;padding:7px 14px;border-radius:999px;background:var(--surface);color:var(--text);border:1px solid transparent;transition:background .2s,color .2s;}
  .chip.active{background:var(--brand);color:var(--brand-fg);}

  /* ---------- Compare bar ---------- */
  #compare-bar{
    display:none;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius);
    padding:10px 14px;margin-bottom:14px;
  }
  #compare-bar span{font-size:13px;color:var(--text-2);}
  #compare-bar button{font-size:13px;font-weight:600;padding:7px 14px;background:var(--brand);color:var(--brand-fg);border-radius:999px;}

  /* ---------- Grid & Card ---------- */
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}

  /*
   * FIX BUG "TEKS BERTUMPUK / TIDAK TERBACA":
   * Semua anak .card (img, .ph-icon, .overlay) dulu pakai position:absolute,
   * artinya TIDAK ADA elemen yang menyumbang tinggi ke .card -- satu-
   * satunya sumber tinggi kartu adalah "aspect-ratio: 3/4". Kalau browser/
   * webview yang dipakai TIDAK mendukung "aspect-ratio" (beberapa WebView
   * Android lama, embed di iframe tertentu, dll), setiap .card langsung
   * collapse ke tinggi 0 -- akibatnya semua .overlay dari puluhan kartu
   * numpuk persis di titik yang sama, kelihatan seperti teks bertumpuk
   * dan tidak terbaca.
   *
   * FIX: kasih "min-height" sebagai fallback, supaya kartu tetap punya
   * tinggi minimum walau "aspect-ratio" tidak didukung/tidak dihitung.
   */
  .card{
    position:relative;
    aspect-ratio:3/4;
    min-height:190px; /* fallback kalau aspect-ratio tidak didukung */
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--surface);
    cursor:pointer;
  }
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card .ph-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-3);}
  .card .cmp-toggle{
    position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:#ffffff;
    box-shadow:0 1px 4px rgba(20,21,26,.12);display:flex;align-items:center;justify-content:center;transition:opacity .2s;
  }
  .card .overlay{
    position:absolute;left:0;right:0;bottom:0;height:26%;background:rgba(255,255,255,0.97);
    padding:7px 10px;display:flex;flex-direction:column;justify-content:center;
  }
  .card .overlay .kat{font-size:10px;color:var(--brand);margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .overlay .nama{font-size:12px;font-weight:600;margin:0 0 1px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .card .overlay .harga{font-size:12px;font-weight:500;color:var(--text-2);margin:0;}

  .empty-state{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--text-3);font-size:14px;}

  /* ---------- Detail ---------- */
  /* Sama seperti .card: kasih fallback tinggi supaya tidak collapse. */
  .hero-img{width:100%;min-height:260px;border-radius:var(--radius);background:var(--surface);display:block;object-fit:cover;aspect-ratio:3/4;}
  .hero-ph{width:100%;min-height:260px;aspect-ratio:3/4;border-radius:var(--radius);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-3);}
  #gallery{display:flex;gap:8px;margin-top:8px;}
  #gallery .thumb{position:relative;flex:1;min-height:64px;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--surface);cursor:pointer;border:2px solid transparent;}
  #gallery .thumb.active{border-color:var(--brand);}
  #gallery .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  .eyebrow{font-size:12px;color:var(--brand);margin:16px 0 2px;}
  .h-title{font-size:19px;font-weight:700;margin:0 0 2px;}
  .h-sub{font-size:13px;color:var(--text-2);margin:0 0 16px;}

  #variant-area{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .variant-box{font-size:13px;padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:#fff;}
  .variant-box.active{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);}
  #variant-select{width:100%;height:44px;font-size:14px;border:1px solid var(--border);border-radius:9px;padding:0 12px;background:#fff;margin-bottom:16px;}

  .price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .price-row .lbl{font-size:11px;color:var(--text-3);margin:0;}
  .price-row .val{font-size:22px;font-weight:700;margin:0;}
  #compare-btn{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;}
  #compare-btn.active{background:var(--brand);color:var(--brand-fg);}

  #spec-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:9px;background:var(--surface);margin-bottom:16px;}
  #spec-toggle span{font-size:13px;font-weight:600;}
  #spec-chevron{transition:transform .35s ease;}
  #spec-list{font-size:13px;color:var(--text-2);margin:-10px 0 16px;padding-left:18px;max-height:0;overflow:hidden;transition:max-height .4s ease;}
  #spec-list li{margin-bottom:4px;}

  .link-row{display:flex;gap:8px;margin-bottom:20px;}
  .link-row a,.link-row button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:9px;background:var(--surface);font-size:11px;text-decoration:none;color:var(--text);}
  .link-row a.disabled{opacity:.35;pointer-events:none;}

  #other-models{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .other-chip{flex-shrink:0;width:104px;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);padding:8px;text-align:center;}
  .other-chip .thumb-wrap{position:relative;width:100%;min-height:88px;aspect-ratio:1/1;border-radius:6px;margin-bottom:6px;background:var(--surface);overflow:hidden;}
  .other-chip .thumb-wrap img,.other-chip .thumb-wrap .ph-icon{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;}
  .other-chip p{margin:0;font-size:12px;font-weight:600;}
  .other-chip p.p2{font-size:11px;color:var(--text-3);font-weight:400;margin-top:2px;}

  /* ---------- Modal (popup bandingkan) ---------- */
  #modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,21,26,.4);z-index:50;align-items:flex-end;justify-content:center;
  }
  #modal-overlay.show{display:flex;}
  #modal{
    background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;
    animation:modalUp .4s cubic-bezier(.4,0,.2,1);
  }
  @keyframes modalUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  #modal-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  #modal-header h3{margin:0;font-size:15px;}
  #modal-search{width:100%;height:40px;border:1px solid var(--border);border-radius:9px;padding:0 12px;font-size:14px;margin:12px 16px;width:calc(100% - 32px);}
  #modal-list{overflow-y:auto;padding:0 16px;flex:1;}
  .modal-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .modal-row .thumb-wrap{position:relative;width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--surface);flex-shrink:0;}
  .modal-row .thumb-wrap img,.modal-row .thumb-wrap .ph-icon{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;}
  .modal-row .info{flex:1;min-width:0;}
  .modal-row .info p{margin:0;font-size:13px;}
  .modal-row .info p.model{font-weight:600;}
  .modal-row .info p.harga{color:var(--text-3);font-size:12px;}
  .modal-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);}
  #modal-footer{padding:14px 16px;border-top:1px solid var(--border);}
  #modal-footer button{width:100%;padding:13px;border-radius:999px;background:var(--brand);color:var(--brand-fg);font-size:14px;font-weight:600;}
  #modal-footer button:disabled{background:var(--border);color:var(--text-3);}

  /* ---------- Compare view ---------- */
  #compare-table{width:100%;border-collapse:collapse;}
  #compare-table th,#compare-table td{padding:8px 6px;text-align:center;vertical-align:top;border-bottom:1px solid var(--border);font-size:13px;}
  #compare-table td.label,#compare-table th.label{text-align:left;color:var(--text-2);font-size:12px;width:90px;}
  #compare-table .thumb-wrap{position:relative;width:64px;height:64px;margin:0 auto;border-radius:8px;overflow:hidden;background:var(--surface);}
  #compare-table .thumb-wrap img,#compare-table .thumb-wrap .ph-icon{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;}
  #compare-table .model-name{font-weight:600;font-size:12px;margin-top:6px;}
  #compare-table ul{margin:0;padding-left:14px;text-align:left;font-size:12px;color:var(--text-2);}
  #compare-empty{text-align:center;color:var(--text-3);padding:48px 0;font-size:14px;}
  #clear-compare{width:100%;margin-top:16px;padding:12px;border-radius:9px;background:var(--surface);font-size:13px;font-weight:600;}

  @media (min-width:640px){
    #grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-inner">
    <button id="back-btn" class="icon-btn" aria-label="Kembali"></button>
    <span id="page-title">Katalog Elitech</span>
    <button id="compare-icon" class="icon-btn" aria-label="Bandingkan">
      <span id="compare-badge"></span>
    </button>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Cari produk...">
      <button id="search-toggle" class="icon-btn" aria-label="Cari"></button>
    </div>
  </div>
</div>

<div class="container">

  <div id="view-grid" class="view active">
    <div id="category-banner">
      <div>
        <p class="eyebrow">#Kategori pilihan</p>
        <p class="title">Alat kesehatan</p>
      </div>
      <div class="icons" id="banner-icons"></div>
    </div>

    <div id="chips"></div>

    <div id="compare-bar">
      <span id="compare-count"></span>
      <button id="compare-view-btn">Lihat perbandingan</button>
    </div>

    <div id="grid"></div>
  </div>

  <div id="view-detail" class="view"></div>

  <div id="view-compare" class="view"></div>

</div>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <h3>Pilih produk untuk dibandingkan</h3>
      <button id="modal-close" class="icon-btn"></button>
    </div>
    <input id="modal-search" type="text" placeholder="Cari produk...">
    <div id="modal-list"></div>
    <div id="modal-footer">
      <button id="modal-confirm">Lihat perbandingan</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   KONFIGURASI
   ========================================================= */
const API_BASE = 'https://script.google.com/macros/s/AKfycbz4Utk0z-v51DjISlUNiDxXL6QVKLxtr6Crxw4QhJleuQcdHB_E1KDBjpOw70JIiUSP/exec';

/* =========================================================
   ICON SET (flat SVG, tanpa dependensi font eksternal)
   ========================================================= */
const ICONS = {
  search: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  compare: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M7 7l3-3M7 7l3 3M17 17H4M17 17l-3-3M17 17l-3 3"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  doc: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>',
  cert: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14.5L7.5 21 12 18.5 16.5 21 15 14.5"/></svg>',
  link: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>',
  close: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  box: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
};
function icon(name){ return ICONS[name] || ''; }

// Handler global untuk fallback saat <img> gagal dimuat (404/expired/dsb).
// SENGAJA dipisah jadi fungsi bernama (bukan HTML mentah disisipkan ke
// dalam atribut onerror="..."), karena SVG ikon mengandung tanda kutip
// ganda (viewBox="0 0 24 24") yang kalau ditaruh langsung di dalam
// atribut onerror="..." (juga kutip ganda) akan memutus atribut itu di
// tengah jalan -- inilah penyebab teks aneh seperti `)">` muncul di
// kartu kemarin.
function handleImgError(imgEl, wrapperTag){
  const div = document.createElement(wrapperTag || 'div');
  div.className = imgEl.className === 'hero-img' ? 'hero-ph' : 'ph-icon';
  div.innerHTML = icon('box');
  imgEl.replaceWith(div);
}

/* =========================================================
   STATE
   ========================================================= */
let allProducts = [];
let categories = [];
let activeCategory = 'semua';
let searchTerm = '';
let compareSet = new Set();
let modalConfirmTargetId = null; // dipakai saat modal dibuka dari halaman detail

const el = id => document.getElementById(id);

/* =========================================================
   FETCH DATA
   ========================================================= */
async function loadList(){
  const params = new URLSearchParams();
  if(activeCategory !== 'semua') params.set('kategori', activeCategory);
  if(searchTerm) params.set('q', searchTerm);
  const res = await fetch(API_BASE + '?action=list&' + params.toString());
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

async function loadDetail(id){
  const res = await fetch(API_BASE + '?action=detail&id=' + encodeURIComponent(id));
  return res.json();
}

async function loadCompare(ids){
  const res = await fetch(API_BASE + '?action=compare&ids=' + encodeURIComponent(ids.join(',')));
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

/* =========================================================
   HELPERS
   ========================================================= */
function rupiah(n){ return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
function priceRange(p){
  return p.hargaMin === p.hargaMax ? rupiah(p.hargaMin) : rupiah(p.hargaMin) + ' - ' + rupiah(p.hargaMax);
}
// Dibungkus dalam wrapper posisi-relatif supaya ph-icon (absolute) selalu
// punya induk berukuran pasti -- konsisten dengan fix .card di atas.
function thumbHtml(url){
  if(url) return `<img src="${url}" alt="" loading="lazy" onerror="this.parentElement.innerHTML=iconBoxOnly()">`;
  return iconBoxOnly();
}
function iconBoxOnly(){
  return `<div class="ph-icon">${icon('box')}</div>`;
}

/* =========================================================
   TOP BAR: search morph + title -> home
   ========================================================= */
el('search-toggle').innerHTML = icon('search');
el('back-btn').innerHTML = icon('back');
el('compare-icon').insertAdjacentHTML('afterbegin', icon('compare'));
el('modal-close').innerHTML = icon('close');

let searchExpanded = false;
function expandSearch(){
  searchExpanded = true;
  el('search-wrap').style.width = '200px';
  el('search-input').style.padding = '0 12px';
  el('page-title').style.opacity = '0';
  el('search-input').focus();
}
function collapseSearch(){
  if(el('search-input').value) return;
  searchExpanded = false;
  el('search-wrap').style.width = '38px';
  el('search-input').style.padding = '0';
  el('page-title').style.opacity = '1';
}
el('search-toggle').addEventListener('click', ()=> searchExpanded ? collapseSearch() : expandSearch());
el('search-input').addEventListener('blur', collapseSearch);
el('search-input').addEventListener('input', e => {
  searchTerm = e.target.value;
  refreshGrid();
});
el('page-title').addEventListener('click', goHome);
el('back-btn').addEventListener('click', goHome);

/* =========================================================
   VIEW SWITCHING (morph)
   ========================================================= */
function switchView(name, title, showBack){
  ['grid','detail','compare'].forEach(v=>{
    const node = el('view-' + v);
    node.classList.toggle('active', v === name);
    node.classList.remove('view-transition');
  });
  requestAnimationFrame(()=> el('view-' + name).classList.add('view-transition'));
  el('page-title').textContent = title;
  el('back-btn').style.display = showBack ? 'flex' : 'none';
  el('compare-icon').style.display = name === 'compare' ? 'none' : 'flex';
  window.scrollTo({top:0, behavior:'smooth'});
}

function goHome(){
  switchView('grid', 'Katalog Elitech', false);
  collapseSearch();
}

/* =========================================================
   GRID
   ========================================================= */
function renderChips(){
  const cats = ['semua', ...new Set(allProducts.map(p=>p.kategori).filter(Boolean))];
  el('chips').innerHTML = cats.map(c=>
    `<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c==='semua'?'Semua':c}</button>`
  ).join('');
  el('chips').querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.cat;
      renderChips();
      refreshGrid();
    });
  });
}

function renderGrid(products){
  const grid = el('grid');
  if(products.length === 0){
    grid.innerHTML = '<p class="empty-state">Produk tidak ditemukan.</p>';
    return;
  }
  grid.innerHTML = products.map(p=>{
    const disabled = !compareSet.has(p.id) && compareSet.size >= 3;
    return `
    <div class="card" data-id="${p.id}">
      ${p.thumbnail ? `<img src="${p.thumbnail}" alt="" loading="lazy" onerror="handleImgError(this)">` : `<div class="ph-icon">${icon('box')}</div>`}
      <button class="cmp-toggle" data-cmp="${p.id}" style="opacity:${disabled?'.35':'1'};color:${compareSet.has(p.id)?'var(--brand)':'var(--text-2)'}">${icon('compare')}</button>
      <div class="overlay">
        <p class="kat">#${p.kategori || 'Produk'}</p>
        <p class="nama">${p.namaDasar}</p>
        <p class="harga">${priceRange(p)}</p>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.cmp-toggle')) return;
      openDetail(card.dataset.id);
    });
  });
  grid.querySelectorAll('.cmp-toggle').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleCompare(btn.dataset.cmp);
    });
  });
}

async function refreshGrid(){
  allProducts = await loadList();
  if(el('chips').children.length === 0) renderChips();
  renderGrid(allProducts);
}

/* =========================================================
   COMPARE (state global dipakai grid + detail + modal)
   ========================================================= */
function toggleCompare(id){
  if(compareSet.has(id)) compareSet.delete(id);
  else if(compareSet.size < 3) compareSet.add(id);
  updateCompareUI();
  renderGrid(filterCurrent());
}
function filterCurrent(){
  return allProducts; // list sudah difilter dari server saat loadList()
}
function updateCompareUI(){
  const bar = el('compare-bar');
  const badge = el('compare-badge');
  if(compareSet.size > 0){
    bar.style.display = 'flex';
    el('compare-count').textContent = compareSet.size + ' dari 3 produk dipilih';
    badge.style.display = 'flex';
    badge.textContent = compareSet.size;
  } else {
    bar.style.display = 'none';
    badge.style.display = 'none';
  }
  const detailBtn = el('detail-compare-btn');
  if(detailBtn){
    detailBtn.classList.toggle('active', compareSet.has(detailBtn.dataset.id));
  }
}
el('compare-icon').addEventListener('click', ()=> openCompareView([...compareSet]));
el('compare-view-btn').addEventListener('click', ()=> openCompareView([...compareSet]));

/* =========================================================
   DETAIL
   ========================================================= */
async function openDetail(id){
  switchView('detail', '...', true);
  const p = await loadDetail(id);
  if(p.error){
    el('view-detail').innerHTML = `<p class="empty-state">${p.error}</p>`;
    return;
  }
  renderDetail(p);
  el('page-title').textContent = p.model;
}

function renderDetail(p){
  const images = p.gambar && p.gambar.length ? p.gambar : [];
  const useBoxes = p.varian.length <= 4;

  el('view-detail').innerHTML = `
    ${images.length
      ? `<img id="hero-img" class="hero-img" src="${images[0]}" alt="${p.model}" onerror="handleImgError(this)">`
      : `<div class="hero-ph">${icon('box')}</div>`}
    ${images.length > 1 ? `<div id="gallery"></div>` : ''}

    <p class="eyebrow">#${p.kategori || 'Produk'}</p>
    <p class="h-title">${p.namaDasar}</p>
    <p class="h-sub">${p.model}</p>

    <div id="variant-area"></div>

    <div class="price-row">
      <div>
        <p class="lbl">Harga</p>
        <p class="val" id="price-out"></p>
      </div>
      <button id="detail-compare-btn" data-id="${p.id}">${icon('compare')}<span>Bandingkan</span></button>
    </div>

    ${p.spesifikasi && p.spesifikasi.length ? `
    <button id="spec-toggle">
      <span>Spesifikasi</span>${icon('chevron')}
    </button>
    <ul id="spec-list">${p.spesifikasi.map(s=>`<li>${s}</li>`).join('')}</ul>
    ` : ''}

    <div class="link-row">
      <a href="${p.links[0]||'#'}" target="_blank" rel="noopener" class="${!p.links[0]?'disabled':''}">${icon('doc')}<span>Brosur</span></a>
      <a href="${p.links[1]||'#'}" target="_blank" rel="noopener" class="${!p.links[1]?'disabled':''}">${icon('cert')}<span>NIE</span></a>
      <a href="${p.links[2]||'#'}" target="_blank" rel="noopener" class="${!p.links[2]?'disabled':''}">${icon('link')}<span>Inaproc</span></a>
    </div>

    ${p.modelLain && p.modelLain.length ? `
    <p class="eyebrow" style="margin-top:0;">Model lain</p>
    <div id="other-models"></div>
    ` : ''}
  `;

  // gallery
  if(images.length > 1){
    const g = document.getElementById('gallery');
    g.innerHTML = images.map((url,i)=>`<div class="thumb ${i===0?'active':''}" data-idx="${i}"><img src="${url}" onerror="this.style.display='none'"></div>`).join('');
    g.querySelectorAll('.thumb').forEach(t=>{
      t.addEventListener('click', ()=>{
        g.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('hero-img').src = images[t.dataset.idx];
      });
    });
  }

  // variant
  const priceOut = document.getElementById('price-out');
  const varArea = document.getElementById('variant-area');
  if(useBoxes){
    varArea.innerHTML = p.varian.map((v,i)=>
      `<button class="variant-box ${i===0?'active':''}" data-idx="${i}">${v.tipe}</button>`
    ).join('');
    varArea.querySelectorAll('.variant-box').forEach(b=>{
      b.addEventListener('click', ()=>{
        varArea.querySelectorAll('.variant-box').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        priceOut.textContent = rupiah(p.varian[b.dataset.idx].harga);
      });
    });
  } else {
    const sel = document.createElement('select');
    sel.id = 'variant-select';
    sel.innerHTML = p.varian.map((v,i)=>`<option value="${i}">${v.tipe} — ${rupiah(v.harga)}</option>`).join('');
    sel.addEventListener('change', ()=> priceOut.textContent = rupiah(p.varian[sel.value].harga));
    varArea.appendChild(sel);
  }
  priceOut.textContent = rupiah(p.varian[0].harga);

  // spesifikasi accordion
  const specToggle = document.getElementById('spec-toggle');
  if(specToggle){
    const list = document.getElementById('spec-list');
    const chevron = specToggle.querySelector('svg');
    let open = false;
    specToggle.addEventListener('click', ()=>{
      open = !open;
      list.style.maxHeight = open ? list.scrollHeight + 'px' : '0';
      chevron.style.transform = open ? 'rotate(180deg)' : 'rotate(0)';
    });
  }

  // compare button
  document.getElementById('detail-compare-btn').addEventListener('click', ()=> openComparePopup(p.id));
  updateCompareUI();

  // model lain
  if(p.modelLain && p.modelLain.length){
    const wrap = document.getElementById('other-models');
    wrap.innerHTML = p.modelLain.map(o=>`
      <div class="other-chip" data-id="${o.id}">
        <div class="thumb-wrap">${thumbHtml(o.thumbnail)}</div>
        <p>${o.model}</p>
        <p class="p2">${priceRange(o)}</p>
      </div>`).join('');
    wrap.querySelectorAll('.other-chip').forEach(c=> c.addEventListener('click', ()=> openDetail(c.dataset.id)));
  }
}

/* =========================================================
   MODAL "PILIH PRODUK UNTUK DIBANDINGKAN" (dari halaman detail)
   ========================================================= */
function openComparePopup(currentId){
  compareSet.add(currentId); // produk yang sedang dibuka otomatis jadi slot pertama
  modalConfirmTargetId = currentId;
  renderModalList('');
  el('modal-search').value = '';
  el('modal-overlay').classList.add('show');
  updateCompareUI();
  renderModalFooter();
}
function renderModalList(query){
  const q = query.toLowerCase();
  const filtered = allProducts.filter(p =>
    (p.namaDasar + ' ' + p.model).toLowerCase().includes(q)
  );
  el('modal-list').innerHTML = filtered.map(p=>{
    const checked = compareSet.has(p.id);
    const disabled = !checked && compareSet.size >= 3;
    return `
    <label class="modal-row" style="opacity:${disabled?'.4':'1'}">
      <div class="thumb-wrap">${thumbHtml(p.thumbnail)}</div>
      <div class="info">
        <p class="model">${p.model}</p>
        <p class="harga">${priceRange(p)}</p>
      </div>
      <input type="checkbox" data-id="${p.id}" ${checked?'checked':''} ${disabled?'disabled':''}>
    </label>`;
  }).join('');
  el('modal-list').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) compareSet.add(cb.dataset.id);
      else compareSet.delete(cb.dataset.id);
      renderModalList(el('modal-search').value);
      renderModalFooter();
      updateCompareUI();
    });
  });
}
function renderModalFooter(){
  el('modal-confirm').disabled = compareSet.size < 2;
  el('modal-confirm').textContent = compareSet.size >= 2
    ? `Lihat perbandingan (${compareSet.size})`
    : 'Pilih minimal 2 produk';
}
el('modal-search').addEventListener('input', e => renderModalList(e.target.value));
el('modal-close').addEventListener('click', ()=> el('modal-overlay').classList.remove('show'));
el('modal-overlay').addEventListener('click', e=>{ if(e.target.id === 'modal-overlay') el('modal-overlay').classList.remove('show'); });
el('modal-confirm').addEventListener('click', ()=>{
  el('modal-overlay').classList.remove('show');
  openCompareView([...compareSet]);
});

/* =========================================================
   COMPARE VIEW
   ========================================================= */
async function openCompareView(ids){
  switchView('compare', 'Perbandingan', true);
  if(ids.length === 0){
    el('view-compare').innerHTML = '<p id="compare-empty">Belum ada produk dipilih. Tap ikon perbandingan pada kartu produk untuk mulai memilih.</p>';
    return;
  }
  const items = await loadCompare(ids);
  const rows = [
    {label:'Kategori', get:m=>m.kategori||'-'},
    {label:'Harga mulai', get:m=>rupiah(m.hargaMin)},
    {label:'Jumlah konfigurasi', get:m=>m.varian.length},
  ];
  el('view-compare').innerHTML = `
    <div style="overflow-x:auto;">
      <table id="compare-table">
        <tr><th class="label"></th>${items.map(m=>`<th><div class="thumb-wrap">${thumbHtml(m.thumbnail)}</div><p class="model-name">${m.model}</p></th>`).join('')}</tr>
        ${rows.map(r=>`<tr><td class="label">${r.label}</td>${items.map(m=>`<td>${r.get(m)}</td>`).join('')}</tr>`).join('')}
        <tr><td class="label">Spesifikasi</td>${items.map(m=>`<td><ul>${(m.spesifikasi||[]).slice(0,4).map(s=>`<li>${s}</li>`).join('')}</ul></td>`).join('')}</tr>
      </table>
    </div>
    <button id="clear-compare">Kosongkan perbandingan</button>
  `;
  document.getElementById('clear-compare').addEventListener('click', ()=>{
    compareSet.clear();
    updateCompareUI();
    goHome();
  });
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  await refreshGrid();
  // lapor ke shell (kalau app ini dibuka di dalam iframe shell) bahwa
  // grid produk pertama sudah selesai dimuat & dirender
  if (window.parent !== window) window.parent.postMessage({ __elitechReady: 'katalog' }, '*');
})();
</script>
